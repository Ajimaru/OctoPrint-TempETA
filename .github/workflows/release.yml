name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "OctoPrint" "octoprint-setuptools"
          python -m pip install build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate paths (prevent directory traversal)
        run: |
          for f in dist/*; do
            rel="$(realpath --relative-to="$(pwd)" "$f")"
            case "$rel" in
              .*) echo "Suspicious path: $f ($rel)"; exit 1 ;;
            esac
          done

      - name: Create zip assets (versioned + latest)
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          zip_versioned="dist/octoprint_tempeta-${version}.zip"
          zip_latest="dist/octoprint_tempeta-latest.zip"

          shopt -s nullglob
          sdist_candidates=(dist/*"${version}".tar.gz)
          if (( ${#sdist_candidates[@]} != 1 )); then
            echo "Expected exactly one sdist tarball matching version ${version}, found ${#sdist_candidates[@]}" >&2
            ls -la dist >&2 || true
            exit 1
          fi
          sdist="${sdist_candidates[0]}"

          if [[ ! -f "$sdist" ]]; then
            echo "Expected sdist not found: $sdist" >&2
            exit 1
          fi

          python - "$sdist" "$zip_versioned" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          tar_path = Path(sys.argv[1])
          zip_path = Path(sys.argv[2])
          zip_path.parent.mkdir(parents=True, exist_ok=True)

          with tarfile.open(tar_path, "r:gz") as tf, zipfile.ZipFile(
              zip_path, "w", compression=zipfile.ZIP_DEFLATED
          ) as zf:
              for member in tf.getmembers():
                  if not member.isfile():
                      continue

                  # Defensive: ensure tar member paths cannot become path traversal entries in the zip.
                  # Tar archives always use POSIX-style paths.
                  member_path = PurePosixPath(member.name)
                  if (
                      member_path.is_absolute()
                      or ".." in member_path.parts
                      or ":" in member.name
                      or member.name.startswith("\\")
                  ):
                      continue

                  extracted = tf.extractfile(member)
                  if extracted is None:
                      continue
                  data = extracted.read()

                  zi = zipfile.ZipInfo(str(member_path))
                  zi.external_attr = (member.mode & 0o777) << 16
                  zf.writestr(zi, data)
          PY

          cp -f "$zip_versioned" "$zip_latest"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          TAG_LOWER="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"
          # Prerelease = a/b/rc/dev segment in the VERSION part of the tag
          # (PEP 440 style, digit or separator before it, e.g. 0.2.2rc1 or
          # 0.2.2.dev6). The match must end at the tag end or at the local
          # part ("+hash"), so a commit hash that happens to end in e.g.
          # "b1" can never flip the detection.
          if echo "$TAG_LOWER" | grep -qE '(^|[-.0-9])(a|b|rc|dev)([.-]?[0-9]+)?($|\+)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          # Notes are grouped by PR label; the categories live in
          # .github/release.yml.
          generate_release_notes: true
          # Always a draft: a release is published by hand once the notes and
          # the attached artifacts have been eyeballed. Pushing a tag must
          # never publish on its own.
          draft: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

      # Optional: Publish to PyPI
      #
      # 1) Create a repository secret named PYPI_API_TOKEN
      # 2) Uncomment the step below
      #
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
