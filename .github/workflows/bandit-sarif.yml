name: Bandit SARIF

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Load tool versions
        run: |
          if [ -f .development/versions.env ]; then
            grep -vE '^\s*(#|$)' .development/versions.env >> "$GITHUB_ENV"
          fi

      - name: Install bandit with SARIF support
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[sarif]${BANDIT_VERSION:+==$BANDIT_VERSION}"

      - name: Run Bandit
        # Reporting only: findings land in the Security tab rather than
        # blocking the run. The pre-commit bandit hook is the gate that
        # actually fails a change.
        run: |
          bandit -r octoprint_temp_eta/ -f sarif -o bandit.sarif || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bandit.sarif
          category: bandit
